name: eventspot
description: "EventSpot — discover local events on an interactive clustered map."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Functional error handling (Either<Failure, T>)
  fpdart: ^1.1.0

  # Networking
  dio: ^5.4.3+1

  # Map (OpenStreetMap tiles — free, no API key) & geolocation
  flutter_map: ^8.2.0
  latlong2: ^0.9.1
  geolocator: ^12.0.0

  # Images
  cached_network_image: ^3.3.1

  # Opens links (tickets, OSM attribution) in the browser
  url_launcher: ^6.3.0

  # Navigation
  go_router: ^14.2.0

  # DI
  get_it: ^7.7.0

  # Local storage & hashing (demo auth)
  shared_preferences: ^2.3.0
  crypto: ^3.0.3

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
